stages:
  prepare:
    cmd: uv run python -m forest_cover.modeling.prepare
    deps:
      - data/raw/covtype.data.gz
      - src/forest_cover/config.py
      - src/forest_cover/eda.py
      - src/forest_cover/modeling/prepare.py
    params:
      - seed
      - prepare.test_size
    outs:
      - data/processed/train.csv.gz
      - data/processed/test.csv.gz

  train:
    cmd: uv run python -m forest_cover.modeling.train
    deps:
      - data/processed/train.csv.gz
      - src/forest_cover/config.py
      - src/forest_cover/eda.py
      - src/forest_cover/modeling/train.py
    params:
      - seed
      - train.model
      - train.parameters.loss
      - train.parameters.penalty
      - train.parameters.alpha
      - train.parameters.max_iter
      - train.parameters.tol
      - train.parameters.class_weight
    outs:
      - models/model.joblib
      - models/training_metadata.json

  evaluate:
    cmd: uv run python -m forest_cover.modeling.evaluate
    deps:
      - data/processed/test.csv.gz
      - models/model.joblib
      - src/forest_cover/config.py
      - src/forest_cover/eda.py
      - src/forest_cover/modeling/evaluate.py
    metrics:
      - metrics.json:
          cache: false
